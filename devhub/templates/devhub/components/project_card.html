<div class="card bg-dark border-secondary mb-3">
    <div class="card-body">
        <h5 class="card-title fw-bold text-light">{{ project.title }}</h5>
        <p class="card-text text-secondary small">{{ project.description|truncatewords:20 }}</p>

        <div class="mb-2">
            {% for tag in project.get_tech_stack_list %}
            <span class="badge bg-secondary me-1">{{ tag }}</span>
            {% endfor %}
        </div>

        <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between align-items-center p-0 pt-2">
            {% if project.github_url %}
            <a href="{{ project.github_url }}" target="_blank" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-github"></i> Repository
            </a>
            {% endif %}

            <a href="{% url 'project_edit' project.pk %}" class="btn btn-sm btn-outline-primary ms-auto">
                Edit
            </a>
        </div>
    </div>
</div>
